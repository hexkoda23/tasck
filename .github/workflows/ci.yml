# Checks every pull request and every push to main.
# Builds both container images but never pushes or deploys anything.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest==9.0.2

      # Only tests that need no server, database or network. The remaining files
      # in backend/tests are integration tests written for the old Emergent host.
      - name: Run unit tests
        working-directory: backend
        env:
          APP_ENV: test
          ENABLE_DEMO_BOOTSTRAP: "false"
          MONGO_URL: mongodb://127.0.0.1:9/?serverSelectionTimeoutMS=1500
          DB_NAME: tasck_ci
        run: >
          python -m pytest -p no:cacheprovider -q
          tests/test_ai_provider_chain.py
          tests/test_brand_scraper_candidates.py
          tests/test_brand_scraper_identity.py
          tests/test_deck_slide_autofit.py
          tests/test_kpi_merge_clean.py
          tests/test_pitch_deck_provider_failures.py
          tests/test_tracker_dedupe.py
          tests/test_tracker_topup.py
          tests/test_tracker_v33_addendum.py
          tests/test_tracker_visibility_gate.py

  image-build:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: tasck-api
            context: backend
          - app: tasck-web
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.app }}:ci-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Smoke test API image
        if: matrix.app == 'tasck-api'
        run: |
          # The API needs MONGO_URL to import; point it at nothing. /api/health
          # must answer without a database.
          docker run -d --name api -p 8000:8000 \
            -e MONGO_URL="mongodb://127.0.0.1:9/?serverSelectionTimeoutMS=1000" \
            -e DB_NAME=tasck_ci tasck-api:ci-${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Smoke test web image
        if: matrix.app == 'tasck-web'
        run: |
          docker run -d --name web -p 8080:8080 -e API_UPSTREAM=http://127.0.0.1:9 tasck-web:ci-${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/healthz && curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'; then exit 0; fi
            sleep 2
          done
          docker logs web
          exit 1
