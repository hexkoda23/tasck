<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TASCK OS - Production Prototype</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');

    :root {
      --blue: #2F55FF;
      --green: #22C55E;
      --dark: #0E1420;
      --dark-2: #111827;
      --ink: #1A1A1A;
      --text: #5C5C5C;
      --muted: #8A8A8A;
      --line: #E8E4DB;
      --line-2: #D4CDBF;
      --v3-bg: #FAFAF7;
      --v3-soft: #F4F2EC;
      --v3-green: #1F4A3A;
      --v3-gold: #C49B5F;
      --v3-olive: #567B3F;
      --v3-red: #B54A37;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--v3-bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .font-display {
      font-family: "Playfair Display", Georgia, serif;
    }

    .font-heading {
      font-family: "Fraunces", Georgia, serif;
    }

    .mono {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .hidden {
      display: none !important;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 0;
      background: transparent;
      text-align: left;
    }

    .logo-button {
      border: 0;
      background: transparent;
      padding: 0;
      display: inline-flex;
      align-items: center;
    }

    .logo-mark {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: var(--blue);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      box-shadow: 0 0 40px rgba(47, 85, 255, 0.22);
    }

    .logo-mark.small {
      width: 32px;
      height: 32px;
    }

    .logo-word {
      font-weight: 800;
      font-size: 11px;
      line-height: 1.1;
      letter-spacing: 0.1em;
      color: #fff;
    }

    .logo.light .logo-word {
      color: #0F172A;
    }

    .logo-letters {
      font-weight: 800;
      font-size: 12px;
      line-height: 1;
      letter-spacing: 0;
    }

    .logo-letters .t {
      color: #6BFF9A;
    }

    .logo-letters .rest {
      color: #fff;
    }

    .landing {
      min-height: 100vh;
      background: var(--dark);
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .landing::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 360px at 28% 42%, rgba(47, 85, 255, 0.12), transparent 62%),
        radial-gradient(ellipse 420px 280px at 74% 63%, rgba(34, 197, 94, 0.08), transparent 56%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .landing-rings {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.9;
    }

    .landing-logo {
      position: fixed;
      top: 24px;
      left: 32px;
      z-index: 20;
    }

    .landing-inner {
      min-height: 100vh;
      width: min(980px, calc(100% - 40px));
      margin: 0 auto;
      display: grid;
      place-items: center;
      text-align: center;
      position: relative;
      z-index: 2;
      padding: 112px 0 54px;
    }

    .landing-kicker {
      color: rgba(255, 255, 255, 0.42);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      margin-bottom: 30px;
    }

    .landing h1 {
      font-size: clamp(52px, 7vw, 92px);
      line-height: 0.92;
      letter-spacing: 0;
      color: #fff;
      margin-bottom: 30px;
    }

    .landing h1 span {
      color: rgba(255, 255, 255, 0.72);
      font-style: italic;
    }

    .landing-copy {
      color: rgba(255, 255, 255, 0.42);
      font-size: 18px;
      line-height: 1.75;
      max-width: 520px;
      margin: 0 auto 34px;
    }

    .landing-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 64px;
    }

    .enter-btn {
      border: 0;
      border-radius: 999px;
      padding: 16px 34px;
      background: #fff;
      color: #0F172A;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 42px rgba(255, 255, 255, 0.09);
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .enter-btn:hover {
      background: rgba(255, 255, 255, 0.92);
      transform: translateY(-1px) scale(1.01);
    }

    .landing-link {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 15px 24px;
      color: rgba(255, 255, 255, 0.76);
      background: rgba(255, 255, 255, 0.04);
      font-size: 13px;
      font-weight: 700;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .landing-link:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .landing-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 42px;
      width: min(560px, 100%);
      margin: 0 auto;
    }

    .landing-stat strong {
      display: block;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .landing-stat span {
      color: rgba(255, 255, 255, 0.28);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .landing-footer {
      color: rgba(255, 255, 255, 0.16);
      font-size: 10px;
      margin-top: 58px;
    }

    .landing-detail {
      position: relative;
      z-index: 2;
      background: #0C111B;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      padding: 72px 24px 90px;
    }

    .landing-detail-inner {
      width: min(1160px, 100%);
      margin: 0 auto;
    }

    .dark-section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .dark-section-head h2 {
      font-family: "Fraunces", Georgia, serif;
      color: #fff;
      font-size: 30px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .dark-section-head p {
      color: rgba(255, 255, 255, 0.42);
      font-size: 14px;
      line-height: 1.6;
      max-width: 680px;
    }

    .dark-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .dark-card {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.035);
      border-radius: var(--radius);
      padding: 18px;
      min-height: 188px;
    }

    .dark-card h3 {
      color: #fff;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .dark-card p {
      color: rgba(255, 255, 255, 0.42);
      font-size: 13px;
      line-height: 1.6;
    }

    .dark-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.72);
      background: rgba(255, 255, 255, 0.06);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .role-screen {
      min-height: 100vh;
      background: var(--v3-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .role-wrap {
      width: min(560px, 100%);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 28px;
    }

    .v3-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 24px 0 22px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      background: rgba(255, 255, 255, 0.5);
    }

    .v3-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--v3-green);
    }

    .role-title {
      font-family: "Fraunces", Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .role-copy {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 28px;
    }

    .role-list {
      display: grid;
      gap: 12px;
    }

    .role-card-v3 {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: #fff;
      text-align: left;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
    }

    .role-card-v3:hover {
      border-color: var(--line-2);
      box-shadow: 0 4px 14px rgba(26, 26, 26, 0.05);
      transform: translateY(-1px);
    }

    .role-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: var(--v3-soft);
      color: var(--v3-green);
      display: grid;
      place-items: center;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .role-card-v3 h3 {
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .role-card-v3 .subtitle {
      color: var(--v3-green);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .role-card-v3 p {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
    }

    .role-footer {
      margin-top: 36px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: var(--muted);
      font-size: 10px;
    }

    .role-footer button {
      border: 0;
      background: transparent;
      color: var(--v3-green);
      font-size: 11px;
    }

    .access-screen {
      min-height: 100vh;
      background: var(--v3-bg);
      padding: 32px 24px 70px;
    }

    .access-wrap {
      width: min(980px, 100%);
      margin: 0 auto;
    }

    .access-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.86fr) minmax(340px, 0.58fr);
      gap: 18px;
      align-items: start;
      margin-top: 32px;
    }

    .v3-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .v3-card-muted {
      background: var(--v3-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .card-pad {
      padding: 20px;
    }

    .v3-heading {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.2;
    }

    .section-kicker {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .section-copy {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      gap: 13px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
    }

    .field textarea {
      min-height: 96px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--line-2);
      box-shadow: 0 0 0 4px rgba(31, 74, 58, 0.08);
    }

    .v3-btn-primary,
    .v3-btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .v3-btn-primary {
      border: 1px solid var(--v3-green);
      background: var(--v3-green);
      color: #fff;
    }

    .v3-btn-primary:hover {
      background: #173D30;
      transform: translateY(-1px);
    }

    .v3-btn-secondary {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
    }

    .v3-btn-secondary:hover {
      border-color: var(--line-2);
      background: var(--v3-soft);
    }

    .v3-btn-full {
      width: 100%;
    }

    .v3-shell {
      display: flex;
      min-height: 100vh;
      background: var(--v3-bg);
      color: var(--ink);
      max-width: 100%;
      overflow-x: hidden;
    }

    .v3-sidebar {
      width: 240px;
      min-height: 100vh;
      background: #fff;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 30;
    }

    .v3-sidebar-head {
      padding: 20px 20px 12px;
    }

    .portal-label {
      margin-top: 12px;
      padding-left: 4px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 10px;
    }

    .v3-nav {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 14px;
      display: grid;
      align-content: start;
      gap: 3px;
    }

    .v3-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      color: var(--text);
      transition: all 0.15s ease;
      text-align: left;
      border: none;
      background: none;
    }

    .v3-nav-item:hover {
      background: var(--v3-soft);
      color: var(--ink);
    }

    .v3-nav-item.active {
      background: #DDE7E2;
      color: var(--v3-green);
      font-weight: 600;
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }

    .v3-sidebar-foot {
      padding: 14px;
      border-top: 1px solid var(--line);
    }

    .v3-main {
      flex: 1;
      margin-left: 240px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-width: 0;
      width: calc(100% - 240px);
    }

    .v3-topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(250, 250, 247, 0.84);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .search-trigger {
      min-width: 260px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: #D4CDBF;
      font-size: 12px;
    }

    .top-spacer {
      flex: 1;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #DDE7E2;
      color: var(--v3-green);
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 800;
    }

    .v3-content {
      flex: 1;
      padding: 32px 40px;
      max-width: 1280px;
      width: 100%;
      min-width: 0;
    }

    .page-kicker {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .page-title-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    .page-title-row h1 {
      font-family: "Fraunces", Georgia, serif;
      color: var(--ink);
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .page-title-row p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      max-width: 760px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 26px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      min-height: 118px;
    }

    .stat-top {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 10px;
      margin-bottom: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--v3-green);
      flex: 0 0 auto;
    }

    .stat-value {
      color: var(--ink);
      font-family: "JetBrains Mono", monospace;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-note {
      color: var(--v3-green);
      font-size: 10px;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    .split {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 12px;
      line-height: 1.55;
    }

    .mini {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 22px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .badge.green {
      color: var(--v3-green);
      background: rgba(31, 74, 58, 0.08);
      border-color: rgba(31, 74, 58, 0.18);
    }

    .badge.gold {
      color: var(--v3-gold);
      background: rgba(196, 155, 95, 0.1);
      border-color: rgba(196, 155, 95, 0.22);
    }

    .badge.olive {
      color: var(--v3-olive);
      background: rgba(86, 123, 63, 0.1);
      border-color: rgba(86, 123, 63, 0.22);
    }

    .badge.red {
      color: var(--v3-red);
      background: rgba(181, 74, 55, 0.09);
      border-color: rgba(181, 74, 55, 0.18);
    }

    .badge.dark {
      color: var(--ink);
      background: transparent;
      border-color: var(--ink);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      background: var(--v3-bg);
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #F4F2EC;
      color: var(--text);
      font-size: 12px;
      line-height: 1.45;
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .attention-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      transition: border-color 0.16s ease, background 0.16s ease;
    }

    .attention-item:hover {
      border-color: var(--line-2);
      background: #fff;
    }

    .stage-line {
      width: 3px;
      align-self: stretch;
      min-height: 42px;
      border-radius: 999px;
      background: var(--v3-green);
      flex: 0 0 auto;
    }

    .pipeline-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 10px;
      overflow-x: auto;
    }

    .pipeline-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 14px;
      min-height: 100px;
    }

    .progress {
      height: 7px;
      border-radius: 999px;
      background: var(--v3-soft);
      overflow: hidden;
      margin-top: 8px;
    }

    .bar {
      height: 100%;
      border-radius: 999px;
      background: var(--v3-green);
    }

    .bar.gold {
      background: var(--v3-gold);
    }

    .bar.red {
      background: var(--v3-red);
    }

    .list {
      display: grid;
      gap: 8px;
      list-style: none;
    }

    .list-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 11px;
      border-radius: 9px;
      background: var(--v3-bg);
      border: 1px solid var(--line);
    }

    .ai-panel {
      background: var(--v3-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
    }

    .score {
      width: 102px;
      height: 102px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #fff 56%, transparent 57%),
        conic-gradient(var(--v3-green) 0 82%, #E8E4DB 82% 100%);
      display: grid;
      place-items: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 24px;
      font-weight: 700;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .readiness {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
    }

    .document-surface {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 42px 48px;
    }

    .document-surface h2 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .document-surface h3 {
      color: var(--ink);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 24px 0 8px;
    }

    .document-surface p,
    .document-surface li {
      color: var(--text);
      font-size: 14px;
      line-height: 1.75;
      margin-bottom: 10px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(14, 20, 32, 0.52);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .modal {
      width: min(640px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 20px 70px rgba(14, 20, 32, 0.22);
    }

    .modal-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 100;
      max-width: 360px;
      background: var(--ink);
      color: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.45;
      box-shadow: 0 18px 50px rgba(14, 20, 32, 0.22);

    @media (max-width: 1100px) {

            ${data.grantOpportunities.map(grant => `
              <div class="v3-card-muted card-pad">
                <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
                  <div>
                    <strong style="font-size:13px;color:#1A1A1A">${grant[0]}</strong>
                    <p class="small muted">${grant[1]}</p>
                  </div>
                  ${badge("new", "gold")}
                </div>
                <div class="split" style="grid-template-columns:repeat(3,minmax(0,1fr));margin:13px 0">
                  <div><p class="mini">Amount</p><p class="small mono">${grant[2]}</p></div>
                  <div><p class="mini">Deadline</p><p class="small">${grant[3]}</p></div>
                  <div><p class="mini">Fit</p><p class="small" style="color:#1F4A3A;font-weight:700">${grant[4]}</p></div>
                </div>
                <p class="small muted">${grant[5]}</p>
                <div style="display:flex;gap:8px;margin-top:12px">
                  <button class="v3-btn-primary" data-action="Approve ${grant[0]}">Approve</button>
                  <button class="v3-btn-secondary" data-action="Reject ${grant[0]}">Reject</button>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function businessCases() {
      const filtered = data.businessCases.filter(row =>
        (state.bcStage === "all" || row.stage === state.bcStage) &&
        (state.bcTrack === "all" || row.engagement_track === state.bcTrack)
      );
      const rows = filtered.map(row => `
        <button class="attention-item" data-action="Open ${row.title}" style="align-items:center">
          <span class="stage-line" style="background:${(data.stageMeta[row.stage] || data.stageMeta.connect)[1]}"></span>
          <span style="flex:1;min-width:0">
            <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
              <strong style="font-size:14px;color:#1A1A1A">${row.title}</strong>
              ${stageBadge(row.stage)}
              ${trackBadge(row)}
              ${health(row)}
            </span>
            <span class="small muted">${row.brand}${row.creator ? ` x ${row.creator}` : ""}</span><br>
            <span class="small muted">${row.next_action}</span>
          </span>
          <span style="text-align:right;flex:0 0 auto">
            <span class="small mono" style="display:block;color:#1F4A3A;font-weight:700">${row.value}</span>
            <span class="mini">${row.days_in_stage}d in stage</span>
          </span>
          <span style="color:#8A8A8A">›</span>
        </button>
      `).join("");

      return `
        <div class="stack">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
            <div>
              <p class="section-kicker">Admin Control Centre</p>
              <h2 class="v3-heading" style="font-size:24px;margin-bottom:4px">Business Cases</h2>
              <p class="small muted">One Business Case = one document chain across Connect -> Frame -> Plan -> Deliver.</p>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="v3-btn-secondary" data-action="AI-generated business cases">AI-generated business cases</button>
              <button class="v3-btn-primary" data-action="New Business Case">New Business Case</button>
            </div>
          </div>
          ${businessCaseOverview()}
          ${businessCaseFilters()}
          ${grantAgentPanel()}
          <div class="stack">
            ${rows || `<div class="v3-card card-pad" style="text-align:center;color:#8A8A8A;font-size:13px">No business cases match these filters.</div>`}
          </div>
        </div>
      `;
    }

    function projectsTable(title = "Projects") {
      return `
        <div class="v3-card card-pad">
          <div class="card-title">${title}</div>
          ${table(["Project", "Brand", "Stage", "Value", "Owner", "Status"], data.businessCases.map(row => [row.title, row.brand, stageBadge(row.stage), row.value, row.rm, row.next_action]))}
        </div>
      `;
    }

    function creativeDirectory(kind) {
      const rows = data.creatives
        .filter(c => kind === "all" || (kind === "creative" ? c[1].includes("Independent") : c[1].includes("Super")))
        .map(c => [
          `<strong>${c[0]}</strong>`,
          c[1],
          `<span class="mono">${c[2]}%</span><div class="progress"><div class="bar ${Number(c[2]) < 90 ? "gold" : ""}" style="width:${c[2]}%"></div></div>`,
          c[3],
          badge(c[4], c[4] === "Available" ? "green" : "gold"),
          `<button class="v3-btn-secondary" data-action="Open ${c[0]} profile">Open</button>`
        ]);
      return `
        <div class="v3-card card-pad">
          <div class="card-title">${kind === "super" ? "Super Creatives" : kind === "creative" ? "Creatives" : "Creative and Super Creative Matching"}</div>
          ${table(["Name", "Type", "Fit", "Specialty", "Status", "Action"], rows)}
        </div>
      `;
    }

    function financePanel(title) {
      return `
        ${statCards([
          ["Available", "N82M", "Cleared and ready", "#1F4A3A"],
          ["Pending", "N44M", "Awaiting approval", "#C49B5F"],
          ["Fees", "N19M", "Strategy and platform", "#567B3F"],
          ["Risk holds", "N4M", "Scope or dispute", "#B54A37"]
        ])}
        <div class="v3-card card-pad">
          <div class="card-title">${title}</div>
          ${table(["Reference", "Project", "Type", "Amount", "Status"], [
            ["TX-8832", "Coke Studio Africa", "Strategy fee", "N15M", badge("Pending", "gold")],
            ["TX-8821", "MTN Creator Partnership", "Creative payout", "N8.4M", badge("Cleared", "green")],
            ["TX-8788", "Access Bank Lifestyle", "Milestone", "N5M", badge("Paid", "green")]
          ])}
        </div>
      `;
    }

    function genericModule(title, bullets) {
      return `
        <div class="layout-grid">
          <div class="v3-card card-pad">
            <div class="card-title">${title}</div>
            <ul class="list">
              ${bullets.map(item => `<li class="list-item"><span class="small">${item}</span>${badge("Production feature", "olive")}</li>`).join("")}
            </ul>
          </div>
          <aside class="ai-panel">
            <div class="card-title">Connected to core workflow</div>
            <p class="small muted">This module must connect to Business Case, project stage, permissions, audit history, and role-based portal visibility.</p>
            <button class="v3-btn-primary v3-btn-full" style="margin-top:12px" data-action="Preview ${title} action">Preview action</button>
          </aside>
        </div>
      `;
    }

    function adminContent(section) {
      if (section === "overview") return adminOverview();
      if (section === "discovery" || section === "opportunities") return discoveryPanel(section);
      if (section === "creative-scraper") return `<div class="layout-grid"><div>${creativeDirectory("creative")}</div><aside>${scannerRules()}</aside></div>`;
      if (section === "super-creative-scraper") return `<div class="layout-grid"><div>${creativeDirectory("super")}</div><aside>${scannerRules()}</aside></div>`;
      if (section === "contact-research") return contactResearch();
      if (section === "meetings") return meetingsPanel();
      if (section === "alignment") return alignmentPanel();
      if (section === "business-cases") return businessCases(true);
      if (section === "pipeline") return `${statCards()}${pipeline()}${projectsTable("Pipeline by business case")}`;
      if (section === "projects") return projectsTable("Projects");
      if (section === "crm") return projectsTable("CRM / Brand records");
      if (section === "creatives") return creativeDirectory("creative");
      if (section === "super-creatives") return creativeDirectory("super");
      if (section === "invoices") return financePanel("Invoices");
      if (section === "wallet") return financePanel("Wallet / Fees");
      if (section === "reports") return genericModule("Reports / Insights", ["Lead quality, conversion, stage velocity, approval speed, delivery health, and revenue reporting.", "Final report generation after project closure.", "Discovery agent performance and missed-opportunity analysis."]);
      if (section === "users") return genericModule("Users / Permissions", ["Admin, Brand, Creative, and Super Creative access control.", "Super Creative can monitor creatives under their build/team.", "Audit logs for every sensitive production action."]);
      if (section === "tasks") return genericModule("Tasks", ["Verify Coca-Cola procurement contact.", "Approve MTN revised scope.", "Review Northside Collective roster.", "Publish final report template."]);
      if (section === "contracts") return genericModule("Contracts", ["Generate contracts after strategy approval.", "Track brand, creative, super creative, and TASCK signatures.", "Connect usage rights, fees, deliverables, and scope changes."]);
      if (section === "templates") return genericModule("Templates", ["Alignment Snapshot templates.", "Strategy Snapshot templates.", "Creative brief, contract, scope change, final report, and follow-up email templates."]);
      if (section === "documents") return genericModule("Documents", ["Central document library for snapshots, briefs, contracts, reports, invoices, and meeting exports.", "Admin publishes documents to brand, creative, or super creative portals.", "Version history and approval status."]);
      return genericModule("Settings", ["Provider settings for email, meetings, scraping, transcription, AI, and storage.", "Workspace profile and notification rules.", "Security, role, and approval preferences."]);
    }

    function brandContent(section) {
      if (section === "dashboard") {
        return `${statCards([
          ["Active Projects", "4", "Coca-Cola, MTN, Access Bank, UBA", "#1F4A3A"],
          ["Pending Approvals", "3", "Snapshots and deliverables", "#C49B5F"],
          ["Open Invoices", "2", "One pending payment", "#567B3F"],
          ["Meetings", "5", "Two upcoming", "#B54A37"]
        ])}<div class="layout-grid"><div>${projectsTable("Brand active projects")}</div><aside class="stack">${readinessPanel()}${approvalsPanel()}</aside></div>`;
      }
      if (section === "projects" || section === "project-detail") return projectsTable(section === "project-detail" ? "Project detail" : "Brand active projects");
      if (section === "alignment") return alignmentPanel();
      if (section === "strategy") return genericModule("Strategy Snapshot Review", ["Review creative route, channel plan, deliverable plan, timeline, KPIs, and risks.", "Comment before Admin advances to delivery.", "Approve or request revision with clear notes."]);
      if (section === "approvals") return approvalsPanel();
      if (section === "documents") return genericModule("Brand Documents", ["Alignment Snapshot PDF.", "Strategy Snapshot PDF.", "Creative brief, contract, invoice, and final report documents."]);
      if (section === "contracts") return genericModule("Brand Contracts", ["Review terms, usage rights, payment schedule, and signature status.", "View scope changes and legal notes.", "Download signed copies."]);
      if (section === "invoices") return financePanel("Brand invoices");
      if (section === "meetings") return meetingsPanel();
      if (section === "messages") return messagesPanel("Brand messages");
      if (section === "reports") return genericModule("Brand Reports", ["Project performance summary.", "Creator output and approval history.", "Final report and learning log after closure."]);
      return genericModule("Brand Settings", ["Brand profile.", "Notification preferences.", "Password and access management."]);
    }

    function approvalsPanel() {
      return `
        <div class="v3-card card-pad">
          <div class="card-title">Approval queue</div>
          <ul class="list">
            <li class="list-item"><span class="small"><strong>Coke Studio Alignment Snapshot</strong><br><span class="muted">Review objective, KPIs, audience, timeline, and risks.</span></span>${badge("Pending", "gold")}</li>
            <li class="list-item"><span class="small"><strong>MTN revised strategy route</strong><br><span class="muted">Reduced deliverables after budget discussion.</span></span>${badge("Needs comment", "olive")}</li>
            <li class="list-item"><span class="small"><strong>Access Bank contract draft</strong><br><span class="muted">Usage rights and production window.</span></span>${badge("Draft", "gold")}</li>
          </ul>
        </div>
      `;
    }

    function creativeContent(section) {
      if (section === "dashboard") {
        return `${statCards([
          ["Assigned Campaigns", "3", "Two active, one pending", "#1F4A3A"],
          ["Deliverables", "7", "4 due this week", "#567B3F"],
          ["Approvals", "2", "Waiting on brand", "#C49B5F"],
          ["Wallet", "N8.4M", "Cleared milestone", "#1F4A3A"]
        ])}<div class="layout-grid"><div>${briefsPanel()}</div><aside class="stack">${deliverablesPanel()}${financePanel("Creative wallet")}</aside></div>`;
      }
      if (section === "briefs") return briefsPanel();
      if (section === "opportunities") return genericModule("Creative Opportunities", ["Invitations matched by specialty, audience, region, availability, and previous performance.", "Creatives can accept interest, decline, or request more details.", "Admin decides final assignment after business case approval."]);
      if (section === "project-detail") return projectsTable("Creative project detail");
      if (section === "deliverables" || section === "uploads") return deliverablesPanel();
      if (section === "approvals") return genericModule("Creative Approvals", ["Track brand comments, admin notes, revision requests, and final approvals.", "Every deliverable should show due date, version, reviewer, and approval history.", "Approved work connects to payment milestones."]);
      if (section === "meetings") return meetingsPanel();
      if (section === "messages") return messagesPanel("Creative messages");
      if (section === "wallet") return financePanel("Creative wallet");
      if (section === "profile") return profilePanel("Creative profile");
      return genericModule("Creative Settings", ["Profile preferences.", "Notification rules.", "Security and account settings."]);
    }

    function briefsPanel() {
      return `
        <div class="v3-card card-pad">
          <div class="card-title">Pending brief: MTN Creator Partnership ${badge("Response due", "gold")}</div>
          <p class="small muted" style="margin-bottom:14px">Create short-form campaign concepts for youth audiences. Brand wants measurable engagement and authentic creator-led storytelling.</p>
          ${table(["Brief", "Brand", "Deadline", "Fee", "Status"], [
            ["Youth creator launch concepts", "MTN", "June 8, 2026", "N4.8M", badge("Pending response", "gold")],
            ["Music culture storyboards", "Coca-Cola", "June 12, 2026", "N6.2M", badge("Assigned", "green")],
            ["Lifestyle campaign cutdowns", "Access Bank", "June 14, 2026", "N2.1M", badge("Reviewing", "olive")]
          ])}
        </div>
      `;
    }

    function deliverablesPanel() {
      return genericModule("Deliverables", ["Concept deck v2 due June 6.", "15s creator video cut submitted for Coca-Cola.", "Behind-the-scenes photo set not started.", "Upload package and captions before approval gate."]);
    }

    function superContent(section) {
      if (section === "dashboard") {
        return `${statCards([
          ["Managed Creatives", "18", "12 active, 4 available", "#1F4A3A"],
          ["Team Projects", "6", "Coke Studio, MTN, Access", "#567B3F"],
          ["Applications", "5", "Roster requests", "#C49B5F"],
          ["Team Earnings", "N18.7M", "Cleared and pending", "#1F4A3A"]
        ])}<div class="layout-grid"><div>${rosterPanel()}</div><aside class="stack">${projectsTable("Team projects")}${financePanel("Team wallet")}</aside></div>`;
      }
      if (section === "managed-creatives") return rosterPanel();
      if (section === "team-projects" || section === "performance") return projectsTable(section === "performance" ? "Team project performance" : "Team projects");
      if (section === "assigned-opportunities") return genericModule("Assigned Opportunities", ["Admin can assign work to a super creative team instead of a single independent creative.", "Super Creative confirms capacity and nominates roster members.", "Opportunity links to business case, meeting notes, scope, and fee expectations."]);
      if (section === "applications") return genericModule("Roster Applications", ["Creatives can request to join a super creative build/team.", "Super Creative reviews portfolio, skills, availability, and verification status.", "Admin can audit team membership and access boundaries."]);
      if (section === "deliverables") return deliverablesPanel();
      if (section === "meetings") return meetingsPanel();
      if (section === "messages") return messagesPanel("Super Creative messages");
      if (section === "wallet") return financePanel("Super Creative team wallet");
      if (section === "roster-profile") return profilePanel("Roster profile");
      return genericModule("Super Creative Settings", ["Team profile.", "Roster access rules.", "Notification and payout preferences."]);
    }

    function rosterPanel() {
      return `
        <div class="v3-card card-pad">
          <div class="card-title">Managed creatives under Leading Vibes ${badge("Super Creative", "gold")}</div>
          <p class="small muted" style="margin-bottom:14px">Each creative can have their own account, while the Super Creative monitors team assignments, capacity, deliverables, meetings, and earnings.</p>
          ${table(["Creative", "Role", "Active Work", "Status", "Action"], data.roster.map(r => [r[0], r[1], r[2], badge(r[3], r[3] === "Available" ? "green" : "gold"), `<button class="v3-btn-secondary" data-action="Open ${r[0]}">Open</button>`]))}
        </div>
      `;
    }

    function messagesPanel(title) {
      return genericModule(title, ["Admin: Alignment Snapshot comments are ready for review.", "Coca-Cola Team: Confirm next meeting and procurement contact.", "Creative Team: Deliverable v2 uploaded for review."]);
    }

    function profilePanel(title) {
      return `
        <div class="layout-grid">
          <div class="v3-card card-pad">
            <div class="card-title">${title}</div>
            ${["Portfolio strength", "Audience proof", "Rate card", "Availability", "Verification"].map((item, index) => `
              <div style="margin-bottom:14px">
                <p class="mini">${item}</p>
                <div class="progress"><div class="bar ${index % 2 ? "gold" : ""}" style="width:${84 - index * 8}%"></div></div>
              </div>
            `).join("")}
          </div>
          <aside class="ai-panel">
            <div class="score">76%</div>
            <h3 class="v3-heading" style="margin:12px 0 6px;font-size:18px">Profile readiness</h3>
            <p class="small muted">Production should use profile completeness and verification as matching signals.</p>
          </aside>
        </div>
      `;
    }

    function renderPortalContent(portal, section) {
      if (portal === "admin") return adminContent(section);
      if (portal === "brand") return brandContent(section);
      if (portal === "creative") return creativeContent(section);
      return superContent(section);
    }

    function modal() {
      if (!state.modal) return "";
      return `
        <div class="modal-backdrop" data-close="true">
          <div class="modal">
            <div class="modal-head">
              <div>
                <p class="mini">Prototype action</p>
                <h2 class="v3-heading" style="font-size:24px">${esc(state.modal)}</h2>
              </div>
              <button class="v3-btn-secondary" data-close="true">Close</button>
            </div>
            <p class="section-copy">
              This static prototype shows the intended product flow. In production this action would call FastAPI,
              write to PostgreSQL, update audit logs, and refresh role-scoped portal views.
            </p>
          </div>
        </div>
      `;
    }

    function render() {
      let html = "";
      if (state.screen === "landing") html = landing();
      if (state.screen === "role") html = roleSelector();
      if (state.screen === "access") html = accessScreen();
      if (state.screen === "portal") html = portalShell();
      app.innerHTML = html + modal() + (state.toast ? `<div class="toast">${esc(state.toast)}</div>` : "");
    }

    document.addEventListener("click", event => {
      const screen = event.target.closest("[data-screen]");
      if (screen) {
        setScreen(screen.getAttribute("data-screen"));
        return;
      }

      const access = event.target.closest("[data-access]");
      if (access) {
        state.accessType = access.getAttribute("data-access");
        setScreen("access");
        return;
      }

      const portal = event.target.closest("[data-portal]");
      if (portal) {
        setPortal(portal.getAttribute("data-portal"));
        return;
      }

      const section = event.target.closest("[data-section]");
      if (section) {
        state.section = section.getAttribute("data-section");
        render();
        window.scrollTo(0, 0);
        return;
      }

      const bcStage = event.target.closest("[data-bc-stage]");
      if (bcStage) {
        state.bcStage = bcStage.getAttribute("data-bc-stage");
        render();
        return;
      }

      const bcTrack = event.target.closest("[data-bc-track]");
      if (bcTrack) {
        state.bcTrack = bcTrack.getAttribute("data-bc-track");
        render();
        return;
      }

      const actionButton = event.target.closest("[data-action]");
      if (actionButton) {
        action(actionButton.getAttribute("data-action"));
        return;
      }

      const close = event.target.closest("[data-close]");
      if (close) {
        state.modal = "";
        render();
      }
    });

    render();
  </script>
</body>
</html>
